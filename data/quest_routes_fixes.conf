# Quest routes fix list (guildmaster spec 2026-10-07 §3 part 1). Read once at worldserver startup.
# One entry per line; '#' starts a comment. Hubs are named by the most common area id among their quest
# givers (`.playerbots routes dump` prints it as area=<id>).
#   skip_hub <area>                                  never route bots to the hubs of this area
#   order <alliance|horde> <map> <area> <area> ...   take these hubs only in this order
#   waypoint <from area> <to area> <map> <x> <y> <z> walk through these points (in file order) between two hubs
#   quest_kind <quest> <kind>                        override the generated kind: deliver, kill, loot_from_mob,
#                                                    use_object, use_item_on_target, cast_on_target, event, escort,
#                                                    unsupported
#   skip_quest <quest>                               routed bots never take this quest
#   quest_spell <quest> <spell> <target entry>       the spell a cast quest needs (used by Plan 5b)

# Capital cities (Task 4 golden review, 2026-10-08): their givers hold class quests and breadcrumbs from level 1 to 60+,
# so a city hub's median level (30-45) would outlevel every starting zone around it. Areas are terrain (ADT) areas: a
# city inside a building takes the area of the ground under it.
skip_hub 153    # Undercity (terrain area Ruins of Lordaeron), lvl 1/32/60
skip_hub 1637   # Orgrimmar, lvl 1/45/74
skip_hub 1638   # Thunder Bluff, lvl 1/30/60
skip_hub 1639   # Thunder Bluff, Elder Rise, lvl 10/23/55
skip_hub 1640   # Thunder Bluff, Spirit Rise, lvl 10/20/52
skip_hub 1519   # Stormwind City
skip_hub 1      # Ironforge (terrain area Dun Morogh), lvl 1/40/60
skip_hub 1658   # Darnassus, Cenarion Enclave, lvl 1/15/60
skip_hub 1660   # Darnassus, Warrior's Terrace, lvl 1/30/60
skip_hub 1661   # Darnassus, The Temple Gardens, lvl 5/35/55
skip_hub 3487   # Silvermoon City, lvl 10/23/60
skip_hub 3580   # The Exodar (terrain area Wildwind Peak), lvl 1/20/60
skip_hub 3703   # Shattrath City, lvl 60/70/80
skip_hub 702    # Rut'theran Village: Teldrassil's portal breadcrumbs, lvl 10/48/57

# Starting-zone flow (Task 4 golden review, 2026-10-08). The dumped path takes near hubs before far ones, so a near
# hub with a high median level can outlevel the zone a new character should do next. One order line per faction and map.
order horde 0 159 228 172 272 115  # Brill, The Sepulcher, Fenris Isle, Tarren Mill (else they outlevel Silverpine), then
                                   # Westfall Lighthouse (neutral Captain Grayson: else a level-15 Forsaken walks to Westfall)
order alliance 0 108 69            # Sentinel Hill (Westfall) before Lakeshire (else Redridge outlevels Westfall)
order alliance 1 442 14            # Auberdine before the neutral goblin hub in Durotar (else a night elf crosses to Durotar at 11)
order horde 1 380 378              # The Crossroads before Camp Taurajo (else Taurajo outlevels the Crossroads)

# Priest "Garments" quests (Task 5 fix round 1, seen live): the objective is a friendly guard healed and buffed by the
# priest (spell credit), stored without the cast flag, so they generate as kill quests and a routed bot would roam at
# the guard forever.
quest_kind 5621 cast_on_target   # Garments of the Moon (Sentinel Shaya)
quest_kind 5624 cast_on_target   # Garments of the Light (Guard Roberts)
quest_kind 5625 cast_on_target   # Garments of the Light (Mountaineer Dolf)
quest_kind 5648 cast_on_target   # Garments of Spirituality (Grunt Kor'ja)
quest_kind 5650 cast_on_target   # Garments of Darkness (Deathguard Kel)
